name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dMailSender-windows-amd64.exe
            build_output: build/bin/dMailSender.exe
          - os: macos-13
            artifact: dMailSender-macos-amd64.zip
            build_output: build/bin/dMailSender.app
          - os: ubuntu-22.04
            artifact: dMailSender-linux-amd64
            build_output: build/bin/dMailSender

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      - name: Build
        run: wails build

      - name: Sign and package macOS app
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - build/bin/dMailSender.app
          cd build/bin
          zip -r ../../${{ matrix.artifact }} dMailSender.app

      - name: Rename artifact
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cp "${{ matrix.build_output }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's New in ${{ github.ref_name }}

            ### Broadcast Mail (동보메일)
            - **Multiple recipients in To field** — Comma or semicolon separated addresses are now parsed into individual RCPT TO commands, supported in both Input and EML modes
            - **Per-recipient numbering** — `#Num` option now applies to each recipient individually (previously broken for broadcast lists)

            ### Numbering Logic Rewritten
            - **Simpler, predictable behavior** — Numbering no longer uses regex-based digit replacement; it always appends `-{N}` to the end
              - Email: `user@example.com` → `user-5@example.com`, `user001@example.com` → `user001-5@example.com`
              - Subject: `Report 2024` → `Report 2024-5` (years, versions, domain digits fully preserved)
            - **Domain/IP safe** — `user@jiran2.com`, `user@192.168.1.1`, unicode local parts all handled correctly
            - **NUM + Timestamp ordering** — Combined form is `{subject}-{N} ({timestamp})`

            ### EML Mode Improvements
            - **Numbering works with "Use Header Envelope"** — Previously silently ignored when the header envelope mode was active; now numbering is applied to the addresses extracted from the EML headers and logged to SMTP Log for traceability
            - **EML override path broadcast + numbering fix** — The override path now parses broadcast lists and applies numbering per-recipient

            ### UI
            - **Dark/Light mode readability** — Added `color-scheme` declaration for proper WebView2 form element theming, adjusted secondary/muted text colors in dark mode (brighter) and primary/secondary/muted in light mode (darker) for improved contrast
            - **To field placeholder** — Updated to indicate multiple recipients are supported
            - **Ctrl+L clears the active bottom tab** — Previously only cleared the SMTP Log tab regardless of which tab was focused; now it clears whichever tab is currently active (Results or SMTP Log), with the `activeTab` state lifted to App level

            ### Bug Fixes
            - **SSL/TLS port override fix** — In SSL/TLS mode, the configured port was being forcibly overridden to 465 because `WithPort` was called before `WithSSLPort` in go-mail option ordering; fixed by reordering so `WithPort` is applied last

            ### Tests
            - **72 edge case tests added** — Numbering, broadcast parsing, subject composition, EML header envelope numbering (including display names, IPv4 literal domains, unicode, multi-recipient headers, and regression cases for all bugs fixed in this release)

            ---
            **Full Changelog**: https://github.com/mimyosa/dmailsender/compare/v0.6...${{ github.ref_name }}
          files: artifacts/*

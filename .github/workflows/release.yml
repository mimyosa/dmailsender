name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dMailSender-windows-amd64.exe
            build_output: build/bin/dMailSender.exe
          - os: macos-14
            artifact: dMailSender-macos-arm64.zip
            build_output: build/bin/dMailSender.app
          - os: ubuntu-22.04
            artifact: dMailSender-linux-amd64
            build_output: build/bin/dMailSender

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        shell: bash
        run: |
          # On macOS (arm64) the Go internal linker can omit the LC_UUID load
          # command, which newer macOS dyld refuses to run (Abort trap: 6).
          # Force the external linker via cgo so LC_UUID is emitted.
          if [ "$RUNNER_OS" = "macOS" ]; then
            CGO_ENABLED=1 go install -ldflags=-linkmode=external github.com/wailsapp/wails/v2/cmd/wails@latest
          else
            go install github.com/wailsapp/wails/v2/cmd/wails@latest
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      - name: Build
        run: wails build

      - name: Sign and package macOS app
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - build/bin/dMailSender.app
          cd build/bin
          zip -r ../../${{ matrix.artifact }} dMailSender.app

      - name: Rename artifact
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cp "${{ matrix.build_output }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's New in ${{ github.ref_name }}

            ### EML Preview Robustness
            - **Non-standard EML support** — Strict RFC parsing runs first; when it fails, a "Force parse" button and an opt-in "Lenient EML Parsing" toggle fall back to a tolerant raw-bytes parser
            - **Correct body decoding** — Fixed quoted-printable double-decoding in multipart bodies, and manual parsing of Content-Type boundaries containing `=` (common in Outlook/Exchange messages)
            - **Charset conversion** — `iso-2022-jp` / `euc-jp` / `shift_jis` bodies and headers are converted to UTF-8 in the preview

            ### SMTP AUTH Mechanism Selection
            - **Choose AUTH method** — `Auto` / `PLAIN` / `LOGIN` / `CRAM-MD5`. `Auto` negotiates the strongest mechanism the server advertises
            - **Implicit-SSL AUTH fix** — AUTH is no longer incorrectly rejected on implicit-SSL (port 465) connections

            ### Bug Fixes
            - **Send mode after switching** — Fixed the first send after switching Input/EML mode using the previous mode (stale closure in the keyboard-shortcut handler)
            - **Unsaved password on send** — A newly typed password is now saved to the keychain before sending, even when triggered via F5 / Send button without leaving the field

            ### CI
            - **macOS runner** — Build on `macos-14` (Apple Silicon / arm64); install the Wails CLI with the external linker so the binary carries an `LC_UUID` load command required by recent macOS dyld

            ---
            **Full Changelog**: https://github.com/mimyosa/dmailsender/compare/v0.7...${{ github.ref_name }}
          files: artifacts/*
